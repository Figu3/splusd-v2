[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
fs_permissions = [{ access = "read", path = "./"}]

# Remappings
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Testing
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 50 }

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 512, depth = 100 }

[fmt]
bracket_spacing = true
int_types = "long"
line_length = 100
multiline_func_header = "params_first"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true

# RPC Endpoints
[rpc_endpoints]
plasma = "${PLASMA_RPC_URL}"
plasma_testnet = "${PLASMA_TESTNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
plasma = { key = "${PLASMASCAN_API_KEY}", url = "https://explorer.plasma.io/api" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
